<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photography — Josmar Córdoba Otárola</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="photography">
<main>
  <div class="page-head"><div class="label">Portfolio</div><h1>Photography</h1></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="masonry" id="grid"></div>
</main>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-top"><span class="label" id="lb-cat"></span><button class="lb-close" id="lb-close" aria-label="Close"></button></div>
  <div class="lb-stage"><img class="lb-img" id="lb-img" alt=""><div class="lb-splash" id="lb-splash"><div class="label">Next album</div><div class="big" id="lb-splash-name"></div></div></div>
  <div class="lb-bottom">
    <div class="lb-caption" id="lb-caption"></div>
    <div class="lb-nav">
      <button class="lb-btn" id="lb-prev" aria-label="Previous">←</button>
      <span class="lb-count" id="lb-count"></span>
      <button class="lb-btn" id="lb-next" aria-label="Next">→</button>
    </div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/photography.js"></script>
</body>
</html>
